# EvoTTT experiment config — default / baseline settings
# Usage: python scripts/launch_evottt.py configs/evottt/default.yaml

# SLURM settings
slurm:
  time: 10:00:00"
  gpus: 1
  cpus_per_task: 8
  partition: qgpu
  account: OPEN-35-8

# Model
model_name: model_1_ptm

# TTT hyperparameters
ttt_steps: 20
ttt_lr: 3.0e-4
lora_rank: 64
last_n_blocks: 48
lora_alpha: 128
grad_clip: 1.0
mask_fraction: 0.15
eval_interval: 1  # evaluate pLDDT every N TTT steps (0 to disable)

# Data paths (defaults match run_evottt.sh)
# data_dir: /scratch/project/open-35-8/pimenol1/af2_data
msa_dir: /scratch/project/open-35-8/data/bfvd/bfvd_beta/input/logan
benchmark_csv: /scratch/project/open-35-8/data/bfvd/bfvd_beta/sample_100_proteins.csv

# Subset selection (all optional)
# protein_ids: "P12345,P67890"
# start_idx: 0
# end_idx: 10
seed: 0

# Flags
skip_existing: false
skip_baseline: false
