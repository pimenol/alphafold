# EvoTTT experiment config — default / baseline settings
# Usage: python scripts/launch_evottt.py configs/evottt/default.yaml

# SLURM settings
slurm:
  time: "10:00:00"
  gpus: 1
  cpus_per_task: 8
  partition: qgpu
  account: OPEN-35-8

# Model
model_name: model_1_ptm

# TTT hyperparameters
ttt_steps: 30
ttt_lr: 1e-4
lora_rank: 4
last_n_blocks: 48
lora_alpha: 8
optimizer: "sgd"  

ttt_msa_clusters: 4  # subsample this many MSA rows per TTT step (null = use all)
ttt_crop_size: 1024
eval_interval: 1
max_extra_msa: 0

# Experiment flags
lora_triangle_attention: false  # Exp 1: add LoRA to triangle (pair) attention
distogram_consistency: false    # Exp 9: distogram consistency loss (symmetric KL between two masked views)
lambda_pair: 0.1                # weight for distogram consistency loss term

grad_accum_steps: 4             # Exp 5: gradient accumulation over N MSA subsamples
block_mask: false               # Exp 8: mask entire residue columns (column masking)
ttt_recycle_prev: true         # frozen prev conditioning from base model recycling
ttt_prev_num_recycle: 3      # num recycles for prev (null = model default, typically 3)
mask_fraction: 1.0

# Data paths (defaults match run_evottt.sh)
# data_dir: /scratch/project/open-35-8/pimenol1/af2_data
msa_dir: /scratch/project/open-35-8/data/bfvd/bfvd_beta/input/logan
benchmark_csv: /scratch/project/open-35-8/pimenol1/alphafold/data/bfvd/summary.csv
output_dir: /scratch/project/open-35-8/pimenol1/alphafold/evottt_outputs

# Subset selection (all optional)
# protein_ids: "A0A1W6I162, Q98576, A0A059PY42"
start_idx: 3
# end_idx: 10
seed: 0

# Flags
skip_existing: false
skip_baseline: false
